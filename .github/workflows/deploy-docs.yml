name: 部署文档
on:
  push:
    branches:
      - hopetheme
permissions:
  contents: write
jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 配置 Swap 空间
        run: |
          if [ -f /swapfile ]; then sudo swapoff /swapfile && sudo rm /swapfile; fi
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 构建主站(分片 1/4,不含 ai-eng/d2l)
        env:
          NODE_OPTIONS: --max_old_space_size=16384
        run: |
          mkdir -p /tmp/stash
          mv src/ai-eng "/tmp/stash/ai-eng"
          mv "src/动手学深度学习" "/tmp/stash/d2l"
          pnpm run docs:build

      - name: 构建 ai-eng 前半分片(分片 2/4,阶段 00-12)
        env:
          NODE_OPTIONS: --max_old_space_size=10240
        run: |
          mv "/tmp/stash/ai-eng" src/ai-eng
          rm -rf src/.vuepress/.temp src/.vuepress/.cache
          sed -i "s#pagePatterns: \[[^]]*\]#pagePatterns: ['ai-eng/README.md', 'ai-eng/0*/**/*.md', 'ai-eng/1[0-2]*/**/*.md']#" src/.vuepress/config.ts
          pnpm exec vuepress-vite build src --dest .build/ai-eng-a

      - name: 构建 ai-eng 后半分片(分片 3/4,阶段 13-19)
        env:
          NODE_OPTIONS: --max_old_space_size=10240
        run: |
          rm -rf src/.vuepress/.temp src/.vuepress/.cache
          sed -i "s#pagePatterns: \[[^]]*\]#pagePatterns: ['ai-eng/1[3-9]*/**/*.md']#" src/.vuepress/config.ts
          pnpm exec vuepress-vite build src --dest .build/ai-eng-b

      - name: 构建 d2l 分片(分片 4/4)
        env:
          NODE_OPTIONS: --max_old_space_size=12288
        run: |
          mv "/tmp/stash/d2l" "src/动手学深度学习"
          rm -rf src/.vuepress/.temp src/.vuepress/.cache
          sed -i "s#pagePatterns: \[[^]]*\]#pagePatterns: ['动手学深度学习/**/*.md']#" src/.vuepress/config.ts
          pnpm exec vuepress-vite build src --dest .build/d2l

      - name: 合并分片产物
        run: |
          cp -r .build/ai-eng-a/ai-eng src/.vuepress/dist/
          cp -rn .build/ai-eng-a/assets/* src/.vuepress/dist/assets/ 2>/dev/null || true
          cp -rn .build/ai-eng-b/ai-eng/* src/.vuepress/dist/ai-eng/ 2>/dev/null || true
          cp -rn .build/ai-eng-b/assets/* src/.vuepress/dist/assets/ 2>/dev/null || true
          cp -r ".build/d2l/动手学深度学习" src/.vuepress/dist/
          cp -rn .build/d2l/assets/* src/.vuepress/dist/assets/ 2>/dev/null || true
          touch src/.vuepress/dist/.nojekyll

      - name: 验证产物
        run: ls -la src/.vuepress/dist/ src/.vuepress/dist/ai-eng | head -30

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/.vuepress/dist

      - name: 上传 dist 供三端打包(不阻塞部署)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: site-dist
          path: src/.vuepress/dist
          compression-level: 0
          retention-days: 3
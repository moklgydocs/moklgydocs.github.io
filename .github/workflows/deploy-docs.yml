name: 部署文档
on:
  push:
    branches:
      - hopetheme
permissions:
  contents: write
jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 配置 Swap 空间
        run: |
          if [ -f /swapfile ]; then sudo swapoff /swapfile && sudo rm /swapfile; fi
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=12288
        run: |
          pnpm run docs:build
          touch src/.vuepress/dist/.nojekyll

      - name: 验证产物
        run: ls -la src/.vuepress/dist/

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: src/.vuepress/dist